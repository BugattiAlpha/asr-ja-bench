# Dependabot バージョン更新の設定
# 方針: 既定3日のクールダウンは受け入れ（明示）、メジャー更新のみ30日に伸ばす。
# セキュリティ更新はクールダウン対象外で即時（GitHub 仕様）。
# 記事: https://bugattialpha.com/trends/dependabot-default-cooldown-3days/
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 30
    # torch / torchaudio の ignore は 2026-07-28 に外した。
    # 入れていた理由は「cu124 が torch 2.6.0 で収録を止めており、Dependabot が PyPI の
    # 最新へ上げようとするたび uv が cu124 の中で見つけられず失敗する」ことだったが、
    # インデックスを cu126 へ移して最新（2.13.0）が解決できるようになったので、
    # その理由が消えた。ignore はセキュリティ更新のPRも止めるため、外せるなら外す。
    # torch は minor / major になるので auto-merge の対象外＝必ず手動レビューになる。
    # 上げるときは CUDA チャンネルの妥当性確認と全モデル再測定をセットで行うこと。
    # 経緯: Obsidian Decisions/2026-07-28-cuda-channel-cu126-torch-upgrade
