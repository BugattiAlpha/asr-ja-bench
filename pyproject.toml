[project]
name = "asr-ja-bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# 上限を 3.14 未満にしている理由: 依存元の cu124 インデックスが配っている wheel は
# cp310〜cp313 までで、Python 3.14 では torch を一切入れられない（2026-07-27 実測）。
# 上限なしだと解決器が 3.14 の分岐まで計算し、uv.lock に入れられない環境の行が増える。
# cu124 に cp314 の wheel が出たら上限を上げる。
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=3.0",
    "faster-whisper>=1.2.1",
    "ml-dtypes>=0.5.1",
    "nemo-toolkit[asr]>=2.7.3",
    "pykakasi>=2.3.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
]


# PyTorch の CUDA ビルド用インデックス。explicit = true にして torch/torchaudio だけに
# 限定する（既定インデックスにすると setuptools 等の共通パッケージまでここから解決され、
# PyPI 側のバージョンが見えなくなって解決に失敗する）。
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[dependency-groups]
dev = [
    # 下限を最新（9.1.1）より1つ古い 9.1.0 に置いている。Dependabot の patch 更新PRが
    # auto-merge 経路を通って無人でマージされるかを実測するための意図的な設定で、
    # 実測が終わったら Dependabot 自身の PR が 9.1.1 へ戻す。
    "pytest>=9.1.0",
]

[tool.uv]
# NeMo が固定する texterrors==0.5.1 は sdist のみで、Windows ではビルドに
# Visual Studio が要る。1.1.8 には cp312 win_amd64 の wheel があるので上書きする。
# （texterrors は nemo.collections.asr の import 連鎖上にあり、除外はできない）
override-dependencies = ["texterrors==1.1.8"]
