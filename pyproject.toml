[project]
name = "asr-ja-bench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# 上限を 3.14 未満にしている理由: 依存元の cu124 インデックスが配っている wheel は
# cp310〜cp313 までで、Python 3.14 では torch を一切入れられない（2026-07-27 実測）。
# 上限なしだと解決器が 3.14 の分岐まで計算し、uv.lock に入れられない環境の行が増える。
# cu124 に cp314 の wheel が出たら上限を上げる。
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=3.0",
    "faster-whisper>=1.2.1",
    "ml-dtypes>=0.5.1",
    "nemo-toolkit[asr]>=2.7.3",
    "pykakasi>=2.3.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
]


# PyTorch の CUDA ビルド用インデックス。explicit = true にして torch/torchaudio だけに
# 限定する（既定インデックスにすると setuptools 等の共通パッケージまでここから解決され、
# PyPI 側のバージョンが見えなくなって解決に失敗する）。
#
# cu124 → cu126 へ切り替えた（2026-07-28）。cu124 の収録は torch 2.4.0〜2.6.0 で更新が
# 止まっており、PyPI の最新（2.13.0）を取りに行けず Dependabot が毎週失敗していた。
# cu126 には cp312/win_amd64 の torch 2.13.0 がある（実測）。
# torchaudio は 2.11.0 が最終版で、以降 torch とバージョンが揃わない。
# 経緯と再測定結果: Obsidian Decisions/2026-07-28-cuda-channel-cu126-torch-upgrade
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# NeMo が固定する texterrors==0.5.1 は sdist のみで、Windows ではビルドに
# Visual Studio が要る。1.1.8 には cp312 win_amd64 の wheel があるので上書きする。
# （texterrors は nemo.collections.asr の import 連鎖上にあり、除外はできない）
override-dependencies = ["texterrors==1.1.8"]
